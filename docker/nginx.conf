server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  include /etc/nginx/security-headers.conf;

  # Service worker, manifest and the HTML shell must always revalidate so updates reach field devices.
  location = /sw.js { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-store" always; try_files $uri =404; }
  location = /index.html { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; }
  location = /manifest.webmanifest { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location /assets/ { include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

  location / { try_files $uri /index.html; }
}
